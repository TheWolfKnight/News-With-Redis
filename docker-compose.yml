networks:
  redis-task-network:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    ports:
      - 6379:6379
    #volumes:
    #  - ./data/redis-data:/data
    environment:
      - REDIS_PASSWORD=yourStrong(!)Password
      - REDIS_PORT=6379

  redis-insight:
    image: redis/redisinsight
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - 8085:5540
    environment:
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
